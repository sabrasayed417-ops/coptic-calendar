
name: Build Coptic Calendar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Get repository files
        uses: actions/checkout@v5

      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file found in repository root."
            exit 1
          fi

          echo "Found project: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/unpacked"

          if [ ! -f "$RUNNER_TEMP/unpacked/coptic_calendar_app/settings.gradle" ]; then
            echo "ERROR: Project folder was not found inside ZIP."
            exit 1
          fi

          rm -rf coptic_calendar_app
          cp -a "$RUNNER_TEMP/unpacked/coptic_calendar_app" ./coptic_calendar_app

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: coptic_calendar_app
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coptic-calendar-approved-design-debug-apk
          path: coptic_calendar_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
